name: Test

on:
  push:
    branches:
      - main
      - develop
      - v2
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Run coverage
        id: cov
        run: |
          go test -race -coverprofile=coverage.txt -covermode=atomic ./...
          # Measure only the shipped library. Exclude: generated output (*_gen.go),
          # the build-time generator (internal/gen — its own guard tests are
          # snapshot-gated and skip in CI), demo bots (examples/), CLI entrypoints
          # (cmd/) and generated mocks (mocks/).
          grep -vE '_gen\.go:|/internal/gen/|/examples/|/cmd/|/mocks/' coverage.txt > coverage.filtered.txt
          pct=$(go tool cover -func=coverage.filtered.txt | awk '/^total:/ {print $NF}' | tr -d '%')
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
          echo "Library coverage: ${pct}%"
        env:
          TEST_BOT_TOKEN: ${{ secrets.TEST_BOT_TOKEN }}

      # Publish the coverage % to a Gist that shields.io renders as the README
      # badge. Only on a push to the active line (v2) or the default branch —
      # secrets aren't available to fork PRs, and we don't want PR runs to
      # overwrite the published number. Auth is the GIST_SECRET repo secret (a PAT
      # with the `gist` scope). Drop `v2` from the condition once it becomes the
      # default branch.
      - name: Update coverage badge
        if: github.event_name == 'push' && (github.ref_name == 'v2' || github.ref_name == github.event.repository.default_branch)
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 2cbfd84a7c06e6dd8c5fec560200d778
          filename: lumex-coverage.json
          label: coverage
          message: ${{ steps.cov.outputs.pct }}%
          valColorRange: ${{ steps.cov.outputs.pct }}
          minColorRange: 0
          maxColorRange: 100
